name: Android build

# Every push to the app produces an installable APK artifact you can download
# on your Android phone and sideload. This is the build -> publish -> validate
# loop without needing Flutter/Android SDK on your own machine.
#
# Upgrade path: swap the upload-artifact step for Firebase App Distribution to
# push builds straight to your phone (needs a Firebase project + service-account
# secret). Left as artifact download to keep this keyless.

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Platform folders are gitignored; regenerate the Android scaffolding.
      - name: Generate Android project
        run: flutter create --platforms=android --project-name doppelganger .

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: doppelganger-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
