name: Android build

# Every push to the app produces an installable APK artifact you can download
# on your Android phone and sideload. This is the build -> publish -> validate
# loop without needing Flutter/Android SDK on your own machine.
#
# Upgrade path: swap the upload-artifact step for Firebase App Distribution to
# push builds straight to your phone (needs a Firebase project + service-account
# secret). Left as artifact download to keep this keyless.

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

# Needed so the workflow can publish the APK to a GitHub Release.
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Platform folders are gitignored; regenerate the Android scaffolding.
      - name: Generate Android project
        run: flutter create --platforms=android --project-name doppelganger .

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doppelganger-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Publish to a rolling pre-release so there's ONE stable URL that always
      # holds the latest build — open it on your phone and install.
      # Download link: <repo>/releases/download/latest-android/app-debug.apk
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-android
          name: Latest Android build
          prerelease: true
          files: app/build/app/outputs/flutter-apk/app-debug.apk
          body: |
            Rolling debug APK for on-phone testing.
            Built from `${{ github.ref_name }}` @ `${{ github.sha }}`.
            Enable "install unknown apps" on Android, then install.
